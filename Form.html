<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Shinning Star Employment Agency</title>

<style>
body{
font-family:Arial;
background:#f2f7ff;
margin:0;
}
header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}
nav{
background:#00509d;
padding:10px;
text-align:center;
}
nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}
.container{
width:90%;
max-width:900px;
margin:auto;
padding:20px;
}
form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
background:#003366;
color:white;
padding:12px;
border:none;
width:100%;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
footer{
background:#003366;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>Perfect Shinning Star Employment Agency</h1>
<p>Your Trusted Employment & Visa Processing Partner</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Jobs</a>
<a href="#">Apply</a>
<a href="#">Contact</a>
</nav>

<div class="container">

<h2>Visa Application Form</h2>


  <form action="https://formspree.io/f/xrpgzwkg" method="POST">

<input type="text" placeholder="Full Name" required>

<input type="date" required>

<select required>
<option>Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input type="text" placeholder="Nationality">

<input type="text" placeholder="Passport Number">

<input type="date">

<input type="tel" placeholder="Phone Number">

<input type="email" placeholder="Email Address">

<textarea placeholder="Home Address"></textarea>

<select>
<option>Visa Type</option>
<option>Work Visa</option>
<option>Student Visa</option>
<option>Tourist Visa</option>
<option>Business Visa</option>
</select>

<input type="text" placeholder="Country Applying To">

<input type="text" placeholder="Occupation">

<textarea placeholder="Previous Travel History"></textarea>


<label>
<input type="checkbox" required>
I declare that all information provided is true.
</label>

<button type="submit">Submit Application</button>

</form>

</div>

<footer>
© 2026 Perfect Shinning Star Employment Agency. All Rights Reserved.
</footer>

</body>
</html>
